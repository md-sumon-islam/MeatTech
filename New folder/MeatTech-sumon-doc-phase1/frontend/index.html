<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeatTech Product Review System</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, select, textarea, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #218838; }
    .card { border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 5px; background: #fff; }
    .btn-action { width: auto; display: inline-block; padding: 6px 12px; margin-right: 5px; font-size: 12px; }
    .btn-edit { background-color: #007bff; }
    .btn-delete { background-color: #dc3545; }
  </style>
</head>
<body>

<div class="container">
  <h2>Product Review System</h2>
  <form id="reviewForm">
    <label><b>Product Name</b></label>
    <input type="text" id="product_name" placeholder="e.g. Fresh Beef Cut" required>

    <label><b>Rating</b></label>
    <select id="rating">
      <option value="5">5 Stars ★★★★★</option>
      <option value="4">4 Stars ★★★★☆</option>
      <option value="3">3 Stars ★★★☆☆</option>
      <option value="2">2 Stars ★★☆☆☆</option>
      <option value="1">1 Star ★☆☆☆☆</option>
    </select>

    <label><b>Comment</b></label>
    <textarea id="comment" placeholder="Write your review..." required></textarea>

    <button type="submit">Submit Review</button>
  </form>

  <hr>
  <h3>Submitted Reviews (Live DB Data)</h3>
  <div id="reviews-list">Loading reviews...</div>
</div>

<script>
  const API_URL = 'http://127.0.0.1:8000/api/reviews';

  // Fetch & Render Reviews
  async function fetchReviews() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();
      
      const listContainer = document.getElementById('reviews-list');

      if (!data || data.length === 0) {
        listContainer.innerHTML = "<p>No reviews submitted yet.</p>";
        return;
      }

      listContainer.innerHTML = data.map((rev, index) => `
        <div class="card">
          <strong>${rev.product_name}</strong> — Rating: ${rev.rating}★
          <p style="margin: 5px 0;">${rev.comment}</p>
          <button class="btn-action btn-edit" onclick="updateReview(${index}, '${rev.product_name}')">Edit</button>
          <button class="btn-action btn-delete" onclick="deleteReview(${index})">Delete</button>
        </div>
      `).join('');

    } catch (error) {
      document.getElementById('reviews-list').innerHTML = "<span style='color:red;'>Failed to connect to backend server.</span>";
    }
  }

  // Create Review
  document.getElementById('reviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const productName = document.getElementById('product_name').value;
    const rating = parseInt(document.getElementById('rating').value);
    const comment = document.getElementById('comment').value;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          product_name: productName,
          rating: rating,
          comment: comment
        })
      });

      if (response.ok) {
        alert("Review submitted successfully!");
        document.getElementById('reviewForm').reset();
        fetchReviews();
      }
    } catch (err) {
      alert("Error connecting to server.");
    }
  });

  // Delete Review
  async function deleteReview(index) {
    if (confirm("Are you sure you want to delete this review?")) {
      const response = await fetch(`${API_URL}/${index}`, { method: 'DELETE' });
      if (response.ok) {
        fetchReviews();
      }
    }
  }

  // Update Review
  async function updateReview(index, oldProductName) {
    const newComment = prompt("Enter new comment:");
    const newRating = prompt("Enter new rating (1-5):");

    if (newComment && newRating) {
      const response = await fetch(`${API_URL}/${index}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          product_name: oldProductName,
          rating: parseInt(newRating),
          comment: newComment
        })
      });

      if (response.ok) {
        fetchReviews();
      }
    }
  }

  // Initial Load
  fetchReviews();
</script>

</body>
</html>
